<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products table</title>
  <link rel="stylesheet" href="../portfliovijay/index.css">
  <link rel="stylesheet" href="products.css">
  <link rel="stylesheet" href="productstable.css">


</head>

<body>
  <div class="container">
    <h1 style="text-align:center;padding:20px">Products</h1>
    <!-- <div id="showProducts">
      
    </div> -->
    <center>
      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Image</th>
            <th>Product Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Rating</th>
            <th>Stock</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="productTable">
        </tbody>
      </table>
    </center>
  </div>
  <script src="productstable.js"></script>
</body>

</html>
